{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="LeadForge AI - Intelligent lead discovery and qualification platform."
  >

  <title>
    {% block title %}LeadForge AI{% endblock %}
  </title>

  <link
    rel="stylesheet"
    href="{% static 'css/tokens.css' %}"
  >

  <link
    rel="stylesheet"
    href="{% static 'css/app.css' %}"
  >

  <script src="{% static 'js/theme.js' %}"></script>

  {% block extra_head %}{% endblock %}
</head>

<body>

  {% block body %}{% endblock %}

  <script src="{% static 'js/app.js' %}"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
