<header class="topbar">

  <div class="topbar-left">

    <button
      class="icon-button mobile-menu-button"
      type="button"
      data-sidebar-toggle
      aria-label="Open navigation"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 6h16"/>
        <path d="M4 12h16"/>
        <path d="M4 18h16"/>
      </svg>
    </button>

    <div class="topbar-title">
      Lead Intelligence Workspace
    </div>

  </div>

  <div class="topbar-right">

    <button
      class="icon-button"
      type="button"
      aria-label="Notifications"
    >
      <svg
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>

    <div class="theme-selector">

      <button
        class="icon-button"
        type="button"
        data-theme-toggle
        aria-label="Change theme"
      >
        <svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.42 1.42"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.42"/>
        </svg>
      </button>

      <div
        class="theme-menu"
        data-theme-menu
      >

        <button
          class="theme-option"
          data-theme-option="light"
          type="button"
        >
          ☀
          Light
        </button>

        <button
          class="theme-option"
          data-theme-option="dark"
          type="button"
        >
          ☾
          Dark
        </button>

        <button
          class="theme-option"
          data-theme-option="system"
          type="button"
        >
          ◐
          System
        </button>

      </div>

    </div>

  </div>

</header>
